# Macro mapping for Surge XT (org.surge-synth-team.surge-xt).
#
# Param ids observed from the installed plugin (Surge XT 1.3.4) via
# `labctl params`, 2026-09-18. Names are informational and serve as the
# fallback lookup: exact match first, then prefix (macro display names
# change when a patch renames them, so the "M1:" prefix is what stays
# stable).
#
# Encoders 1..8: Surge's 8 patch macros.
# Faders 1..4: scene A amp envelope A/D/S/R.

plugin-id = "org.surge-synth-team.surge-xt"

