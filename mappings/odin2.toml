# Macro mapping for Odin2 (com.thewavewarden.odin2).
#
# Param ids observed from the installed plugin (Odin2 2.4.1) via
# `labctl params --plugin Odin2`, 2026-09-19. Names are copied exactly as
# the plugin reports them (including "Wavetble Position").
#
# Encoders: classic subtractive macro set around filter 1 and osc 1.
# Faders: amp envelope A/D/S/R, mirroring the Surge XT layout.

